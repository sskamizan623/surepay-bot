<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SurePay BD</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://libtl.com/sdk.js" data-zone="12356364" data-sdk="show_12356364"></script>
<style>
body{font-family:sans-serif;background:#0f172a;color:#fff;margin:0;padding:15px;padding-bottom:70px}
.card{background:#1e293b;border-radius:12px;padding:15px;margin-bottom:12px}
.header{text-align:center;background:#1d4ed8}
.balance{font-size:30px;font-weight:bold;color:#fbbf24;margin:5px 0}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:15px;font-weight:bold;margin-top:8px}
.g{background:#10b981;color:#fff}.b{background:#3b82f6;color:#fff}.y{background:#f59e0b;color:#000}
.row{display:flex;justify-content:space-between;align-items:center}
input,select{width:100%;padding:10px;margin-top:8px;border-radius:6px;border:1px solid #475569;background:#0f172a;color:#fff;box-sizing:border-box}
.nav{position:fixed;bottom:0;left:0;right:0;background:#1e293b;display:flex;justify-content:space-around;padding:12px 0}
.nav button{background:none;border:none;color:#38bdf8;font-size:15px;font-weight:bold}
.hide{display:none}
</style>
</head>
<body>
<div class="card header">
<div id="uname">Welcome!</div>
<div class="balance"><span id="c">0</span> Coins</div>
<small>1000 Coins = 10 Taka</small>
</div>
<div id="t1">
<div class="card row"><div><b>Watch Ad (+15)</b></div><button class="btn g" style="width:auto;padding:8px 15px" onclick="ad(15)">Watch</button></div>
<div class="card row"><div><b>Channel Task (+20)</b></div><button class="btn b" style="width:auto;padding:8px 15px" onclick="ch()">Join</button></div>
<div class="card"><b>Math: <span id="q">5+5</span> = ?</b><input type="number" id="ans"><button class="btn y" onclick="math()">Submit</button></div>
</div>
<div id="t2" class="hide card"><h3>Refer (+100 Coins)</h3><input id="rl" readonly><button class="btn b" onclick="cp()">Copy Link</button></div>
<div id="t3" class="hide card"><h3>Withdraw (Min 1000)</h3><select id="m"><option>bKash</option><option>Nagad</option></select><input id="p" placeholder="Number"><input id="a" placeholder="Coins"><button class="btn g" onclick="wd()">Withdraw</button></div>
<div class="nav"><button onclick="tab(1)">Tasks</button><button onclick="tab(2)">Refer</button><button onclick="tab(3)">Withdraw</button></div>
<script>
var c=0,n1=5,n2=5,uid="guest";
try{var tg=window.Telegram.WebApp;tg.expand();if(tg.initDataUnsafe.user){uid=tg.initDataUnsafe.user.id;document.getElementById('uname').innerText="Hi, "+tg.initDataUnsafe.user.first_name;}}catch(e){}
document.getElementById('rl').value="https://t.me"+uid;
function tab(x){document.getElementById('t1').className=x==1?'':'hide';document.getElementById('t2').className=x==2?'card':'hide card';document.getElementById('t3').className=x==3?'card':'hide card';}
function ad(r){if(typeof show_12356364==='function'){show_12356364().then(function(){c+=r;document.getElementById('c').innerText=c;alert("+"+r+" Coins!");});}else{c+=r;document.getElementById('c').innerText=c;alert("+"+r+" Coins!");}}
function ch(){window.open("https://t.me");c+=20;document.getElementById('c').innerText=c;alert("+20 Coins!");}
function math(){if(parseInt(document.getElementById('ans').value)==(n1+n2)){c+=5;document.getElementById('c').innerText=c;n1=Math.floor(Math.random()*10)+1;n2=Math.floor(Math.random()*10)+1;document.getElementById('q').innerText=n1+"+"+n2;document.getElementById('ans').value='';alert("+5 Coins!");}else{alert("Wrong!");}}
function cp(){var e=document.getElementById('rl');e.select();document.execCommand('copy');alert("Copied!");}
function wd(){var a=parseInt(document.getElementById('a').value);if(a>=1000&&a<=c){c-=a;document.getElementById('c').innerText=c;alert("Request Sent!");}else{alert("Min 1000 Coins!");}}
</script>
</body>
</html>
